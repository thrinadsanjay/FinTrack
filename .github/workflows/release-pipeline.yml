name: Release pipeline

# Shared production release: gate -> next version -> build & push image -> git tag
#   -> prepare server (sync-server.yml: .env, clone/update main, stack up) -> deploy over SSH.
# Called by:
#   - release.yml  after a reviewed PR is merged into Development (direct: false)
#   - ci.yml       on a push to fix/cicd when the TEST_MODE variable is not "true" (direct: true):
#                  no test server and no merge first, straight to production
# It calls only sync-server.yml (never ci.yml or release.yml, which would be a cycle).
#
# Versioning: git tags vMAJOR.MINOR.PATCH are the single source of truth.
# Each release bumps PATCH of the highest tag.
on:
  workflow_call:
    inputs:
      direct:
        description: Direct release from fix/cicd (TEST_MODE off) instead of a merged PR
        type: boolean
        default: false
      pr:
        description: Merged pull request number (release.yml only)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # One production release/rollback at a time, whichever path started it. Never cancelled.
  # (Different from release.yml's own group, so caller and callee never wait on each other.)
  group: release-production
  cancel-in-progress: false

env:
  DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE || 'automationbuilder/fintracker' }}

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.direct.outputs.release || steps.merged.outputs.release }}
    steps:
      - name: Checkout for change detection
        if: inputs.direct
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Direct release from fix/cicd (TEST_MODE is not "true")
        id: direct
        if: inputs.direct
        env:
          TEST_MODE: ${{ vars.TEST_MODE }}
          FORCE_DEPLOY: ${{ vars.FORCE_DEPLOY }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/fix/cicd" ] || [ "${TEST_MODE}" = "true" ]; then
            echo "::error::Direct production releases run only from fix/cicd with TEST_MODE != true (ref ${GITHUB_REF}, TEST_MODE=${TEST_MODE:-unset})."
            exit 1
          fi
          # Force a release without application changes: repository variable FORCE_DEPLOY=true
          # (every push while set), or "[force-deploy]" in the pushed commit's message (one push).
          if [ "${FORCE_DEPLOY}" = "true" ] || [[ "${COMMIT_MSG}" == *"[force-deploy]"* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Forced release of ${GITHUB_SHA::7} ($( [ "${FORCE_DEPLOY}" = "true" ] && echo 'FORCE_DEPLOY=true' || echo '[force-deploy] in commit message' )); change detection skipped."
            exit 0
          fi
          # Same rule as release.yml's `paths` filter: only image content triggers a release.
          # Compared with the last released version (not just the previous push), so a push
          # whose release was superseded in the queue is still picked up by the next one.
          # No release tag in this branch's history -> release to be safe.
          last="$(git tag --merged HEAD --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          if [ -n "$last" ]; then
            changed="$(git diff --name-only "$last" HEAD)"
            if ! printf '%s\n' "$changed" | grep -qE '^(app/|Dockerfile$|\.dockerignore$|requirements\.txt$)'; then
              echo "No image content changed since ${last}; nothing to release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "Direct production release of ${GITHUB_SHA::7} from fix/cicd (TEST_MODE=${TEST_MODE:-unset})"

      - name: Merged-PR release (checked by release.yml)
        id: merged
        if: ${{ !inputs.direct }}
        run: echo "release=true" >> "$GITHUB_OUTPUT"

  version:
    name: Determine version
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      previous: ${{ steps.v.outputs.previous }}
      rerun: ${{ steps.v.outputs.rerun }}
    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Next patch version from git tags
        id: v
        run: |
          set -euo pipefail
          semver='^v[0-9]+\.[0-9]+\.[0-9]+$'
          latest="$(git tag --list 'v*' --sort=-v:refname | grep -E "$semver" | head -n1 || true)"
          # Re-running a release for the same commit reuses its version.
          here="$(git tag --points-at HEAD --list 'v*' --sort=-v:refname | grep -E "$semver" | head -n1 || true)"
          if [ -n "$here" ]; then
            version="${here#v}"; rerun=true
          elif [ -z "$latest" ]; then
            version="1.0.0"; rerun=false
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            version="${major}.${minor}.$((patch + 1))"; rerun=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous=${latest#v}" >> "$GITHUB_OUTPUT"
          echo "rerun=$rerun" >> "$GITHUB_OUTPUT"
          echo "Previous release: ${latest:-none}  ->  this release: v${version}$( [ "$rerun" = true ] && echo ' (re-run)')"

  build:
    name: Build & push image
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the release tag after a successful push
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RERUN: ${{ needs.version.outputs.rerun }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Refuse to overwrite an immutable version tag
        id: exists
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${DOCKER_IMAGE}:${VERSION}" >/dev/null 2>&1; then
            if [ "$RERUN" = "true" ]; then
              echo "${DOCKER_IMAGE}:${VERSION} already published by an earlier run of this commit; reusing it."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::${DOCKER_IMAGE}:${VERSION} already exists on Docker Hub but no git tag v${VERSION} points at this commit. Refusing to overwrite an immutable tag."
              exit 1
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push ${{ env.DOCKER_IMAGE }}:${{ env.VERSION }} + latest
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ env.VERSION }}
            VCS_REF=${{ github.sha }}
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ env.VERSION }}
            ${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag the release commit v${{ env.VERSION }}
        if: env.RERUN != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "FinTracker ${VERSION}" "$GITHUB_SHA"
          # Tags pushed with GITHUB_TOKEN do not trigger workflows (no loop).
          git push origin "refs/tags/v${VERSION}"

  sync-server:
    name: Prepare server
    # Writes .env, clones/updates `main` in DEPLOY_PATH and starts the stack, so the
    # first release on a fresh server works and .env always matches Secrets/Variables.
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/sync-server.yml
    secrets: inherit

  deploy:
    name: Deploy to server
    needs: [version, build, sync-server]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Development
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout (deploy script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Deploy ${{ env.VERSION }}
        id: ssh
        uses: ./.github/actions/ssh-deploy
        with:
          version: ${{ env.VERSION }}
          image: ${{ env.DOCKER_IMAGE }}
          deploy-path: ${{ vars.DEPLOY_PATH }}
          service: ${{ vars.COMPOSE_SERVICE || 'fintracker' }}
          compose-file: ${{ vars.COMPOSE_FILE || '' }}
          server-host: ${{ secrets.SERVER_HOST }}
          server-user: ${{ secrets.SERVER_USER }}
          server-port: ${{ vars.SERVER_PORT || '22' }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Release summary
        env:
          PREVIOUS: ${{ steps.ssh.outputs.previous-version }}
          PR: ${{ inputs.pr }}
          SOURCE: ${{ inputs.direct && 'direct push to fix/cicd (TEST_MODE off, no test server)' || '' }}
        run: |
          cat <<EOF
          ========================================
          FinTracker Deployment Successful
          ========================================

          Application Version: ${VERSION}

          Docker Image:
          ${DOCKER_IMAGE}:${VERSION}

          Latest:
          ${DOCKER_IMAGE}:latest

          Environment:
          Development

          Deployment Server:
          <masked>

          Previously Running:
          ${PREVIOUS:-unknown}

          Deployment Status:
          SUCCESS
          ========================================
          EOF
          {
            echo "## ✅ FinTracker ${VERSION} deployed"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${VERSION}\` (git tag \`v${VERSION}\`) |"
            echo "| Image | \`${DOCKER_IMAGE}:${VERSION}\` |"
            echo "| Latest | \`${DOCKER_IMAGE}:latest\` → same image |"
            echo "| Environment | Development |"
            echo "| Server | _masked_ |"
            echo "| Previously running | \`${PREVIOUS:-unknown}\` |"
            if [ -n "$SOURCE" ]; then echo "| Source | ${SOURCE} |"; else echo "| Pull request | #${PR} |"; fi
            echo
            echo "Roll back: **Actions → Rollback FinTracker → Run workflow** with \`${PREVIOUS:-<version>}\`."
          } >> "$GITHUB_STEP_SUMMARY"
