name: Release FinTracker

# Runs when a pull request is merged into Development:
#   merged-PR guard -> CI gate -> release-pipeline.yml (version -> build & push -> git tag -> deploy)
# (A push to fix/cicd with TEST_MODE off calls release-pipeline.yml directly from ci.yml.)
#
# Only changes to what goes INTO the image start a release: the Dockerfile copies
# requirements.txt and app/ only. README, docs, tests, workflows and the deployment
# bundle (deploy/, env.example) never build an image; publish-main.yml publishes the
# bundle to `main` instead. Run this workflow manually to force a rebuild
# (e.g. to pick up base-image security patches).
#
# Versioning: git tags vMAJOR.MINOR.PATCH are the single source of truth.
# Each release bumps PATCH of the highest tag. Nothing is committed back to
# Development, so there is no CI loop and branch protection needs no bypass.
on:
  push:
    branches:
      - Development
    paths:
      - "app/**"
      - "Dockerfile"
      - ".dockerignore"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment to deploy to (its Variables/Secrets and server are used)
        type: choice
        options:
          - Development
          - Production
        default: Development

permissions:
  contents: read

concurrency:
  # One Development release at a time, in merge order. Never cancel a running release.
  # (release-pipeline.yml additionally serializes all production releases and rollbacks.)
  group: release-development
  cancel-in-progress: false

jobs:
  guard:
    name: Merged-PR guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.check.outputs.pr }}
    steps:
      - name: Only deploy commits that came from a merged pull request
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/Development" ]; then
            echo "::error::Releases are built from Development only (this run is on ${GITHUB_REF})."
            exit 1
          fi
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
                --jq '[.[] | select(.merged_at != null and .base.ref == "Development")][0].number // empty')"
          if [ -z "$pr" ]; then
            echo "::error::${GITHUB_SHA::7} was pushed to Development without a merged pull request. Nothing is released or deployed; merge changes through a reviewed PR."
            exit 1
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "Commit ${GITHUB_SHA::7} comes from merged PR #$pr"

  ci:
    name: CI gate
    needs: guard
    # A called reusable workflow can never have more access than its caller grants,
    # and GitHub checks this for every job in ci.yml even when its `if:` skips it:
    # open-pull-request needs pull-requests: write, release-production contents: write.
    # On a push to Development neither of those jobs runs.
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    needs: [guard, ci]
    permissions:
      contents: write # release tag
    uses: ./.github/workflows/release-pipeline.yml
    with:
      pr: ${{ needs.guard.outputs.pr }}
      environment: ${{ inputs.environment || 'Development' }}
    secrets: inherit
