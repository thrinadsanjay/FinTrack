{% extends "base/auth-base.html" %}
{% block title %}Reset password · {{ FT_APP_NAME }}{% endblock %}

{% block content %}
<div class="ft-auth" style="grid-template-columns:1fr">
  <section class="ft-auth__panel" style="min-height:100dvh">
    <div class="ft-auth__card">
      <h1>Reset your password</h1>
      <p class="ft-muted">You must set a new password before continuing.</p>
      {% if error %}
      <div class="ft-alert ft-alert--error" style="margin-bottom:1rem">{{ error }}</div>
      {% endif %}
      <form method="post" action="/reset-password" class="ft-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
        <div class="ft-field">
          <label for="password">New password</label>
          <input class="ft-input" id="password" name="password" type="password" required minlength="8">
        </div>
        <div class="ft-field">
          <label for="confirm_password">Confirm password</label>
          <input class="ft-input" id="confirm_password" name="confirm_password" type="password" required minlength="8">
        </div>
        <button class="ft-btn ft-btn--primary ft-btn--block" type="submit">Save password</button>
      </form>
    </div>
  </section>
</div>
{% endblock %}
