{% extends "base/base.html" %}
{% block title %}Something went wrong · {{ FT_APP_NAME }}{% endblock %}
{% block content %}
<div class="ft-card" style="max-width: 36rem;">
  <h1 class="ft-display" style="font-size:1.75rem;margin-bottom:0.5rem">Something went wrong</h1>
  <p class="ft-muted" style="margin-bottom:1.25rem;white-space:pre-wrap">{{ error or 'An unexpected error occurred.' }}</p>
  <div style="display:flex;gap:0.5rem;flex-wrap:wrap">
    <a class="ft-btn ft-btn--primary" href="/">Back home</a>
    <a class="ft-btn ft-btn--secondary" href="javascript:history.back()">Go back</a>
  </div>
</div>
{% endblock %}
