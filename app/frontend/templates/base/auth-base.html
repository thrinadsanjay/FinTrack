<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="csrf-token" content="{{ csrf_token(request) }}">
  <title>{% block title %}{{ FT_APP_NAME }}{% endblock %}</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/favicon-16x16.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/static/css/app.css?v={{ FT_APP_VERSION }}-assist8">
  {% block extra_css %}{% endblock %}
  <meta name="theme-color" content="#b96f42">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("ft_theme");
        document.documentElement.setAttribute("data-theme", saved || "light");
      } catch (_e) {}
    })();
  </script>
</head>
<body class="user-guest">
  {% block content %}{% endblock %}
  {% include "layout/toast-stack.html" %}
  {% include "layout/chat-widget.html" %}
  <script src="/static/js/app.js?v={{ FT_APP_VERSION }}" defer></script>
  <script src="/static/js/chat-widget.js?v={{ FT_APP_VERSION }}-assist9" defer></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
