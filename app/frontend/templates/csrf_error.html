{% extends "base/base.html" %}
{% block title %}Request blocked · {{ FT_APP_NAME }}{% endblock %}
{% block content %}
<div class="ft-card" style="max-width: 36rem;">
  <h1 class="ft-display" style="font-size:1.75rem;margin-bottom:0.5rem">Security check failed</h1>
  <p class="ft-muted" style="margin-bottom:1.25rem">{{ error or 'Your session token expired or was invalid. Refresh and try again.' }}</p>
  <a class="ft-btn ft-btn--primary" href="/">Back home</a>
</div>
{% endblock %}
