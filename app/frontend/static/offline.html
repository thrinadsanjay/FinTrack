<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offline · FinTracker</title>
  <meta name="theme-color" content="#e9e0d4">
  <style>
    :root { color-scheme: light dark; --bg:#f6f5f2; --card:#fff; --ink:#1f1b16; --muted:#6b6259; --accent:#b86d3f; --line:#e1ded8; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0b0f13; --card:#141a1f; --ink:#eef1f4; --muted:#a6adb5; --accent:#c47a4a; --line:#283139; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:24px; padding-top:calc(24px + env(safe-area-inset-top)); background:var(--bg); color:var(--ink);
           font: 16px/1.5 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width:min(360px, 100%); padding:28px 22px; border:1px solid var(--line); border-radius:20px; background:var(--card); text-align:center; }
    img { width:56px; height:56px; }
    h1 { margin:14px 0 6px; font-size:1.3rem; }
    p { margin:0 0 18px; color:var(--muted); font-size:.95rem; }
    button { min-height:46px; width:100%; border:0; border-radius:12px; background:var(--accent); color:#fff; font:inherit; font-weight:700; cursor:pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/static/icons/FinTracker_exact.svg" alt="">
    <h1>You're offline</h1>
    <p>FinTracker needs a connection to show your latest balances and to save changes. Nothing is stored on this device.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
