# FinTracker production stack: MongoDB + mongo-express + FinTracker.
#
# Published to the `main` branch by .github/workflows/publish-main.yml; the server
# clones `main` and never builds anything. The FinTracker image is built by GitHub
# Actions and pulled from Docker Hub.
#
#   Update:  git pull && docker compose pull fintracker && docker compose up -d
#
# Why the explicit `pull`: `up -d` does NOT re-download a tag that already exists
# locally, so a new `latest` is only fetched by `docker compose pull`. Only the
# fintracker service is pulled so MongoDB never jumps versions by accident.
# (No `pull_policy: always` on purpose: the automatic deploy re-points the local
# `latest` when it rolls back a failed release, and always-pull would undo that.)
#
# Deployment pipeline requirements (scripts/deploy/remote_deploy.sh):
#   - the app service is named `fintracker`
#   - its image is automationbuilder/fintracker:${FINTRACKER_VERSION:-latest}
#   - no `build:` section
name: fin_tracker

services:
  mongo:
    image: mongo:${FT_MONGO_IMAGE_TAG:-latest} # pin to the major version you run, e.g. 7.0
    hostname: mongodb
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-fintracker}
    # Loopback only by default: the app reaches MongoDB over the internal network.
    # Set FT_MONGO_BIND=0.0.0.0 in .env only if you need remote access (and have auth on).
    ports:
      - "${FT_MONGO_BIND:-127.0.0.1}:${FT_MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
      # TLS material lives outside git (chmod 700): ca.pem, mongodb-cert.pem, client-cert.pem.
      - ${FT_CERTS_DIR:-./certs}:/certs:ro
    # To require TLS, uncomment (and add tls options to FT_MONGO_URI in .env):
    # command: ["mongod", "--tlsMode", "requireTLS", "--tlsCertificateKeyFile", "/certs/mongodb-cert.pem", "--tlsCAFile", "/certs/ca.pem"]
    security_opt:
      - apparmor=unconfined
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' mongodb:27017/admin | grep 1 >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - ft-net

  mongo-express:
    image: mongo-express:1.0.2
    hostname: mongo-express
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8081" # mongo-express reads PORT; don't inherit the app's PORT from .env
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: ${ME_CONFIG_MONGODB_PORT:-27017}
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD:?set ME_CONFIG_BASICAUTH_PASSWORD in .env}
      ME_CONFIG_OPTIONS_EDITORTHEME: ${ME_CONFIG_OPTIONS_EDITORTHEME:-ambiance}
    # Loopback only by default (reach it through an SSH tunnel or reverse proxy).
    # Set FT_MONGO_EXPRESS_BIND=0.0.0.0 in .env to expose it on the network.
    ports:
      - "${FT_MONGO_EXPRESS_BIND:-127.0.0.1}:${FT_MONGO_EXPRESS_PORT:-8081}:8081"
    volumes:
      - ${FT_CERTS_DIR:-./certs}:/certs:ro
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - ft-net

  # Single container: FastAPI API + server-rendered UI + background schedulers.
  fintracker:
    image: automationbuilder/fintracker:${FINTRACKER_VERSION:-latest}
    hostname: fintracker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${PORT:-8000}
      # Proxmox/LXC often blocks uvloop socketpair used for signal handling.
      UVICORN_LOOP: asyncio
    ports:
      - "${FT_PUBLIC_PORT:-8008}:${PORT:-8000}"
    volumes:
      - app_logs:/fintracker/logs
      - app_backups:/fintracker/backups
      # Admin-uploaded logos; without a volume they vanish on every image update.
      - app_uploads:/app/app/frontend/static/uploads
      - ${FT_CERTS_DIR:-./certs}:/certs:ro
    security_opt:
      - apparmor=unconfined
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - ft-net
    # Health check is built into the image (GET /health).

networks:
  ft-net:
    driver: bridge

# Fixed names so data survives project renames and matches volumes created by the
# development stack (docker/compose.yml, project "fin_tracker"). Check `docker volume ls`
# before the first start on a server that already has data.
volumes:
  mongodb_data:
    name: ${FT_MONGO_VOLUME:-fin_tracker_mongodb_data}
  app_logs:
    name: fin_tracker_app_logs
  app_backups:
    name: fin_tracker_app_backups
  app_uploads:
    name: fin_tracker_app_uploads
