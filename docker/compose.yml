name: fin_tracker

volumes:
  mongodb_data:
  app_logs:
  app_backups:

networks:
  ft-net:
    driver: bridge

x-shared: &shared
  restart: unless-stopped
  networks:
    - ft-net

services:
  mongo:
    <<: *shared
    image: mongo:latest 
    hostname: mongodb
    env_file:
      - ../.env
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-fintracker}
    ports:
      - "${FT_MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
      # TLS material lives outside git. Point FT_CERTS_DIR at a host directory
      # (e.g. /etc/fintracker/certs, chmod 700) holding ca.pem, mongodb-cert.pem, client-cert.pem.
      - ${FT_CERTS_DIR:-../db/certs}:/certs:ro
      - ../db/config/mongod.conf:/etc/mongo/mongod.conf:ro
    security_opt:
    - apparmor=unconfined
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' mongodb:27017/admin | grep 1 >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  mongo-express:
    <<: *shared
    image: mongo-express:1.0.2
    hostname: mongo-express
    # profiles: ["tools"]
    env_file:
      - ../.env
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb # ${ME_CONFIG_MONGODB_SERVER:-mongodb}
      ME_CONFIG_MONGODB_PORT: ${ME_CONFIG_MONGODB_PORT:-27017}
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD:-change-me}
      ME_CONFIG_OPTIONS_EDITORTHEME: ${ME_CONFIG_OPTIONS_EDITORTHEME:-ambiance}
    volumes:
      - ${FT_CERTS_DIR:-../db/certs}:/certs:ro
    ports:
      - "${FT_MONGO_EXPRESS_PORT:-8081}:8000"
    depends_on:
      mongo:
        condition: service_healthy

  # Single container: FastAPI API + server-rendered UI + background schedulers.
  fintracker:
    <<: *shared
    env_file:
      - ../.env
    image: fintracker:${FT_APP_VERSION:-1.0.0}
    build:
      context: ../
      dockerfile: Dockerfile
    hostname: fintracker
    ports:
      - "${FT_APP_PORT:-8001}:${PORT:-8000}"
    volumes:
      - app_logs:/fintracker/logs
      - app_backups:/fintracker/backups
      - "../app:/app/app:z"
      # Same certs for the app's Mongo client, e.g.
      # FT_MONGO_URI=mongodb://mongodb:27017/?tls=true&tlsCAFile=/certs/ca.pem&tlsCertificateKeyFile=/certs/client-cert.pem
      - ${FT_CERTS_DIR:-../db/certs}:/certs:ro
    environment:
      PORT: ${PORT:-8000}
      # Proxmox/LXC often blocks uvloop socketpair used for signal handling.
      UVICORN_LOOP: asyncio
    security_opt:
      - apparmor=unconfined
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      mongo:
        condition: service_healthy
    # ../app is bind-mounted, so reload on code changes. Without it, Jinja picks up
    # template edits live while Python stays stale ("'x' is undefined" errors).
    command:
      [
        "sh",
        "-c",
        "uvicorn app.main:app --host 0.0.0.0 --port $${PORT:-8000} --loop asyncio --http h11 --timeout-graceful-shutdown 10 --reload --reload-dir /app/app",
      ]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import sys, urllib.request;
          response = urllib.request.urlopen('http://127.0.0.1:${PORT:-8000}/health', timeout=5);
          sys.exit(0 if response.status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
