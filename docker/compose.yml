name: fin_tracker

volumes:
  mongodb_data:
  app_logs:
  app_backups:

networks:
  ft-net:
    driver: bridge

x-shared: &shared
  restart: unless-stopped
  networks:
    - ft-net

services:
  mongodb:
    <<: *shared
    image: mongo:7.0
    hostname: mongodb
    env_file:
      - ../.env
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-fintracker}
    ports:
      - "${FT_MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' mongodb:27017/admin | grep 1 >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  mongo-express:
    <<: *shared
    image: mongo-express:1.0.2
    hostname: mongo-express
    # profiles: ["tools"]
    env_file:
      - ../.env
    environment:
      ME_CONFIG_MONGODB_SERVER: ${ME_CONFIG_MONGODB_SERVER:-mongodb}
      ME_CONFIG_MONGODB_PORT: ${ME_CONFIG_MONGODB_PORT:-27017}
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD:-change-me}
      ME_CONFIG_OPTIONS_EDITORTHEME: ${ME_CONFIG_OPTIONS_EDITORTHEME:-ambiance}
    ports:
      - "${FT_MONGO_EXPRESS_PORT:-8081}:8081"
    depends_on:
      mongodb:
        condition: service_healthy

  backend:
    <<: *shared
    env_file:
      - ../.env
    image: fin_tracker_backend:${FT_APP_VERSION:-1.0.0}
    build:
      context: ../
      dockerfile: Dockerfile
    hostname: ft_app
    ports:
      - "${FT_BACKEND_PORT:-8000}:${PORT:-8000}"
    volumes:
      - app_logs:/fintracker/logs
      - app_backups:/fintracker/backups
      #- "../app:/app/app:z"
    environment:
      PORT: ${PORT:-8000}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import sys, urllib.request;
          response = urllib.request.urlopen('http://127.0.0.1:${PORT:-8000}/health', timeout=5);
          sys.exit(0 if response.status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
